  SECTION_PAGES.push(TOTAL);
  PAGE_TYPES.push('section');
  TOTAL++;
  for(var j = 0; j < s.count; j++){
    PAGE_TYPES.push('photo');
    PHOTO_INDEX[TOTAL] = {sec:i, img:j};
    TOTAL++;
  }
});
PAGE_TYPES.push('backcover');
TOTAL += 1;

var book = document.getElementById('book');
var pager = document.getElementById('pager');
var btnPrev = document.getElementById('btnPrev');
var btnNext = document.getElementById('btnNext');
var loader = document.getElementById('loader');
var loaderNum = document.getElementById('loaderNum');
var toast = document.getElementById('toast');

var pages = [];
var cur = 0;
var animating = false;
var ratios = [];
var COVER_RATIO = 0.62;
ratios[0] = COVER_RATIO;      /* 封面 */
ratios[1] = COVER_RATIO;      /* 目录 */
ratios[TOTAL-1] = COVER_RATIO;/* 封底 */
SECTIONS.forEach(function(s, i){
  ratios[SECTION_PAGES[i]] = COVER_RATIO; /* 章节页 */
  for(var j = 0; j < s.count; j++){
    ratios[SECTION_PAGES[i]+1+j] = s.ratios[j];
  }
});

/* ============ 音效 ============ */
var audioCtx = null, audioUnlocked = false;
function initAudio(){
  if(audioUnlocked) return;
  try{
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if(audioCtx.state === 'suspended') audioCtx.resume();
    audioUnlocked = true;
  }catch(e){ audioCtx = null; }
}
function playFlipSound(){
  if(!audioCtx || audioCtx.state !== 'running') return;
  var t = audioCtx.currentTime, sr = audioCtx.sampleRate;
  var dur = 0.32;
  var buf = audioCtx.createBuffer(1, Math.floor(sr * dur), sr);
  var data = buf.getChannelData(0);
  for(var i = 0; i < data.length; i++){
    var p = i / data.length;
    var env = Math.pow(1 - p, 1.4) * (0.6 + 0.4 * Math.sin(p * Math.PI));
    data[i] = (Math.random() * 2 - 1) * env;
  }
  var src = audioCtx.createBufferSource(); src.buffer = buf;
  var bp = audioCtx.createBiquadFilter(); bp.type = 'bandpass';
  bp.frequency.setValueAtTime(3200, t); bp.frequency.exponentialRampToValueAtTime(1400, t + dur); bp.Q.value = 0.7;
  var g = audioCtx.createGain();
  g.gain.setValueAtTime(0.14, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  src.connect(bp); bp.connect(g); g.connect(audioCtx.destination); src.start(t);
  var osc = audioCtx.createOscillator(); osc.type = 'sine';
  osc.frequency.setValueAtTime(200, t + 0.16); osc.frequency.exponentialRampToValueAtTime(70, t + 0.26);
  var og = audioCtx.createGain();
  og.gain.setValueAtTime(0.0001, t + 0.16); og.gain.exponentialRampToValueAtTime(0.07, t + 0.17); og.gain.exponentialRampToValueAtTime(0.001, t + 0.28);
  osc.connect(og); og.connect(audioCtx.destination); osc.start(t + 0.16); osc.stop(t + 0.3);
}
document.addEventListener('touchstart', initAudio, {passive:true, once:true});
document.addEventListener('click', initAudio, {once:true});

/* ============ 构建页面 ============ */
function pad(n){ return n < 10 ? '0' + n : '' + n; }
function coverHTML(){
  return '<div class="cover"><div class="cover-frame"></div><div class="cover-diamond"></div>' +
    '<div class="cover-kicker">千 年 古 树 档 案</div><h1>古树图鉴<br>千年古木志</h1>' +
    '<div class="cover-rule"></div><div class="cover-sub">香樟 · 侧柏 · 金桂 全记录</div>' +
    '<div class="cover-data"><div class="row"><span>五 大 类 别</span><span class="dot"></span><span>109 幅 影 像</span></div>' +
    '<div class="row"><span>千年树龄</span><span class="dot"></span><span>历劫重生</span></div></div>' +
    '<div class="cover-hint">轻触目录 · 翻阅千年</div></div>';
}
function tocHTML(){
  var html = '<div class="toc"><div class="toc-title">目 录</div><div class="toc-sub">CONTENTS</div><div class="toc-list">';
  SECTIONS.forEach(function(s, i){
    html += '<div class="toc-item" data-sec="' + i + '">' +
      '<div><div class="t-name">' + s.name + '</div><div class="t-sub">' + s.sub + '</div></div>' +
      '<div class="t-meta"><span class="t-count">' + s.count + ' 幅</span><span class="t-arrow">›</span></div>' +
      '</div>';
  });
  html += '</div></div>';
  return html;
}
function sectionHTML(i){
  var s = SECTIONS[i];
  return '<div class="section"><div class="section-frame"></div>' +
    '<div class="section-no">第 ' + (i+1) + ' 章</div>' +
    '<div class="section-name">' + s.name + '</div>' +
    '<div class="section-rule"></div><div class="section-sub">' + s.sub + '</div>' +
    '<div class="section-count">共 ' + s.count + ' 幅影像 · 轻触翻阅</div></div>';
}
function backcoverHTML(){
  return '<div class="backcover"><div class="the-end">完</div><div class="end-sub">千年古树档案 · 古树图鉴</div></div>';
}
function backMarkHTML(no){
  return '<div class="back-mark"><svg width="30" height="30" viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"><path d="M20 6 C16 12 14 16 14 21 C14 27 17 32 20 34 C23 32 26 27 26 21 C26 16 24 12 20 6 Z"/><path d="M8 34 L32 34"/></svg><div class="back-no">' + no + '</div></div>';
}

function buildPages(){
  var i, p, front, back;
  for(i = 0; i < TOTAL; i++){
    p = document.createElement('div');
    p.className = 'page' + (i === 0 ? ' is-cur' : '');
    p.dataset.idx = i;
    front = document.createElement('div');
    front.className = 'pg-face pg-front';
    if(PAGE_TYPES[i] === 'cover'){ front.innerHTML = coverHTML(); }
    else if(PAGE_TYPES[i] === 'toc'){ front.innerHTML = tocHTML(); }
    else if(PAGE_TYPES[i] === 'photo'){
      var img = document.createElement('img');
      img.className = 'photo';
      img.alt = '古树影像 ' + i;
      img.loading = 'lazy';
      front.appendChild(img);
    }
    else if(PAGE_TYPES[i] === 'backcover'){ front.innerHTML = backcoverHTML(); }
    else { /* section */
      var si = SECTION_PAGES.indexOf(i);
      front.innerHTML = sectionHTML(si);
    }
    back = document.createElement('div');
    back.className = 'pg-face pg-back';
    back.innerHTML = backMarkHTML(pad(i + 1));
    p.appendChild(front); p.appendChild(back);
    book.appendChild(p); pages.push(p);
  }
}

/* 按需加载：翻到某页时设置img src（浏览器缓存保证不重复下载） */
function ensureImg(pageIdx){
  if(PAGE_TYPES[pageIdx] !== 'photo') return;
  var info = PHOTO_INDEX[pageIdx];
  var url = SECTIONS[info.sec].urls[info.img];
  var img = pages[pageIdx].querySelector('.photo');
  if(img && !img.src) img.src = url;
}
function preloadNear(idx){
  for(var d = -2; d <= 2; d++){
    var t = idx + d;
    if(t >= 0 && t < TOTAL) ensureImg(t);
  }
}

/* ============ 尺寸 ============ */
function resize(){
  var ratio = ratios[cur] || COVER_RATIO;
  var w = window.innerWidth, h = window.innerHeight;
  var bh = Math.min(h * 0.78, 900);
  var bw = bh * ratio;
  if(bw > w * 0.9){ bw = w * 0.9; bh = bw / ratio; }
  book.style.width = bw + 'px';
  book.style.height = bh + 'px';
}

/* ============ 翻页 ============ */
function finishFlip(el){
  el.classList.remove('is-cur','is-flipping','flip-fwd','flip-back');
  el.classList.add('is-done');
  var np = pages[cur];
  np.classList.remove('is-done'); np.classList.add('is-cur');
  animating = false;
  preloadNear(cur);
  resize(); updateUI();
}
function goNext(){
  if(animating || cur >= TOTAL - 1) return;
  animating = true; playFlipSound();
  var el = pages[cur];
  el.classList.add('is-flipping','flip-fwd');
  var done = false;
  var onEnd = function(e){
    if(done) return;
    if(e && e.animationName && e.animationName !== 'flipFwd') return;
    done = true; el.removeEventListener('animationend', onEnd);
    cur++; finishFlip(el);
  };
  el.addEventListener('animationend', onEnd);
  setTimeout(function(){ if(animating) onEnd(null); }, 700);
}
function goPrev(){
  if(animating || cur <= 0) return;
  animating = true; playFlipSound();
  var el = pages[cur];
  el.classList.add('is-flipping','flip-back');
  var done = false;
  var onEnd = function(e){
    if(done) return;
    if(e && e.animationName && e.animationName !== 'flipBack') return;
    done = true; el.removeEventListener('animationend', onEnd);
    cur--; finishFlip(el);
  };
  el.addEventListener('animationend', onEnd);
  setTimeout(function(){ if(animating) onEnd(null); }, 700);
}
/* 目录/章节跳转：快速翻页过渡 */
function jumpTo(target){
  if(animating || target === cur || target < 0 || target >= TOTAL) return;
  animating = true; playFlipSound();
  var el = pages[cur];
  var dir = target > cur ? 'flip-fwd' : 'flip-back';
  el.classList.add('is-flipping', dir);
  setTimeout(function(){
    cur = target;
    pages.forEach(function(pg, i){
      if(i !== cur){
        pg.classList.remove('is-cur','is-flipping','flip-fwd','flip-back');
        pg.classList.add('is-done');
      }
    });
    finishFlip(el);
  }, 300);
}
function updateUI(){
  pager.innerHTML = '<b>' + (cur + 1) + '</b> / ' + TOTAL;
  btnPrev.classList.toggle('disabled', cur <= 0);
  btnNext.classList.toggle('disabled', cur >= TOTAL - 1);
}

/* ============ 交互 ============ */
var startX = 0, startY = 0, moved = false, suppressClick = false;
book.addEventListener('touchstart', function(e){
  startX = e.touches[0].clientX; startY = e.touches[0].clientY; moved = false;
}, {passive:true});
book.addEventListener('touchmove', function(e){
  var dx = e.touches[0].clientX - startX, dy = e.touches[0].clientY - startY;
  if(Math.abs(dx) > 8 || Math.abs(dy) > 8) moved = true;
  if(moved && Math.abs(dx) > Math.abs(dy)) e.preventDefault();
}, {passive:false});
book.addEventListener('touchend', function(e){
  if(!moved) return;
  var dx = e.changedTouches[0].clientX - startX;
  if(Math.abs(dx) > 40){
    suppressClick = true;
    if(dx < 0) goNext(); else goPrev();
    setTimeout(function(){ suppressClick = false; }, 350);
  }
}, {passive:true});
book.addEventListener('click', function(e){
  if(suppressClick) return;
  /* 目录项点击 */
  var tocItem = e.target.closest('.toc-item');
  if(tocItem){
    var si = parseInt(tocItem.getAttribute('data-sec'), 10);
    jumpTo(SECTION_PAGES[si]);
    return;
  }
  /* 章节页点击：进入第一张照片 */
  var si2 = SECTION_PAGES.indexOf(cur);
  if(PAGE_TYPES[cur] === 'section' && si2 >= 0){
    goNext();
    return;
  }
  var r = book.getBoundingClientRect();
  var x = e.clientX - r.left;
  if(x < r.width * 0.42) goPrev();
  else if(x > r.width * 0.58) goNext();
});
btnPrev.addEventListener('click', goPrev);
btnNext.addEventListener('click', goNext);
document.addEventListener('keydown', function(e){
  if(e.key === 'ArrowRight') goNext();
  else if(e.key === 'ArrowLeft') goPrev();
});
window.addEventListener('resize', resize);

/* ============ 预加载 ============ */
var loaded = 0;
function preloadKey(){
  /* 关键页：封面、目录、5个章节页、前几张照片 */
  var list = [];
  list.push(0); list.push(1);
  SECTIONS.forEach(function(s, i){ list.push(SECTION_PAGES[i]); });
  for(var i = 2; i < 8 && i < TOTAL; i++) list.push(i);
  var real = list.filter(function(idx){ return PAGE_TYPES[idx] === 'photo'; });
  if(real.length === 0){ start(); return; }
  var target = real.length;
  real.forEach(function(idx){
    var info = PHOTO_INDEX[idx];
    var im = new Image();
    im.onload = im.onerror = function(){
      loaded++;
      loaderNum.textContent = loaded + ' / ' + real.length;
      if(loaded >= target) start();
    };
    im.src = SECTIONS[info.sec].urls[info.img];
  });
}

var started = false;
function start(){
  if(started) return;
  started = true;
  buildPages();
  resize();
  preloadNear(0);
  requestAnimationFrame(function(){
    requestAnimationFrame(function(){
      book.classList.add('ready');
      loader.classList.add('hide');
      updateUI();
      setTimeout(function(){ toast.classList.add('show'); setTimeout(function(){ toast.classList.remove('show'); }, 3200); }, 400);
    });
  });
}

/* 容错：若预加载回调异常，5秒后仍启动 */
setTimeout(start, 5000);
window.onerror = function(msg, src, line){
  var el = document.getElementById('loaderNum');
  if(el) el.textContent = 'ERR: ' + msg + ' L' + line;
};
preloadKey();
})();
</script>
