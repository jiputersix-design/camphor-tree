<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta http-equiv="Cache-Control" content="no-store,no-cache,must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>古树图鉴 · 电子画册</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;}
body{
  background:radial-gradient(120% 100% at 50% 0%,#16352a 0%,#0d1f17 55%,#08150f 100%);
  font-family:"PingFang SC","Noto Serif SC",serif;
  display:flex;align-items:center;justify-content:center;
  padding:32px 24px;color:#e9e2d0;min-height:100vh;
}
.card{max-width:420px;width:100%;text-align:center;
  border:1px solid rgba(217,189,133,.35);border-radius:18px;
  padding:46px 28px 40px;background:rgba(255,255,255,.03);}
.diamond{width:10px;height:10px;background:#d9bd85;transform:rotate(45deg);margin:0 auto 26px;}
h1{font-size:23px;letter-spacing:.22em;color:#d9bd85;font-weight:600;margin-bottom:8px;}
.en{font-size:11px;letter-spacing:.32em;color:#7e9487;margin-bottom:30px;}
.rule{width:54px;height:1px;background:linear-gradient(90deg,transparent,rgba(217,189,133,.7),transparent);margin:0 auto 28px;}
.main{font-size:17px;letter-spacing:.08em;line-height:1.9;color:#f0ead8;margin-bottom:14px;}
.sub{font-size:13.5px;letter-spacing:.05em;line-height:1.9;color:#9fb3a6;}
.tag{margin-top:34px;display:inline-block;font-size:12px;letter-spacing:.28em;color:#8fa898;
  border:1px solid rgba(217,189,133,.3);border-radius:999px;padding:8px 20px;}
</style>
</head>
<body>
<div class="card">
  <div class="diamond"></div>
  <h1>古树图鉴</h1>
  <div class="en">ANCIENT TREES ARCHIVE</div>
  <div class="rule"></div>
  <div class="main">本电子画册已制作完成<br>访问暂未开放</div>
  <div class="sub">完成交付后即刻恢复浏览<br>如需查阅，请联系制作方</div>
  <div class="tag">暂 停 访 问</div>
</div>
</body>
</html>
