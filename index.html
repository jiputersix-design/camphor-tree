    audioUnlocked = true;
  }catch(e){ audioCtx = null; }
}
function playFlipSound(){
  if(!audioCtx || audioCtx.state !== 'running') return;
  var t = audioCtx.currentTime, sr = audioCtx.sampleRate;
  var dur = 0.3;
  var buf = audioCtx.createBuffer(1, Math.floor(sr * dur), sr);
  var data = buf.getChannelData(0);
  for(var i = 0; i < data.length; i++){
    var p = i / data.length;
    var env = Math.pow(1 - p, 1.4) * (0.6 + 0.4 * Math.sin(p * Math.PI));
    data[i] = (Math.random() * 2 - 1) * env;
  }
  var src = audioCtx.createBufferSource(); src.buffer = buf;
  var bp = audioCtx.createBiquadFilter(); bp.type = 'bandpass';
  bp.frequency.setValueAtTime(3200, t); bp.frequency.exponentialRampToValueAtTime(1400, t + dur); bp.Q.value = 0.7;
  var g = audioCtx.createGain();
  g.gain.setValueAtTime(0.12, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  src.connect(bp); bp.connect(g); g.connect(audioCtx.destination); src.start(t);
  var osc = audioCtx.createOscillator(); osc.type = 'sine';
  osc.frequency.setValueAtTime(200, t + 0.15); osc.frequency.exponentialRampToValueAtTime(70, t + 0.25);
  var og = audioCtx.createGain();
  og.gain.setValueAtTime(0.0001, t + 0.15); og.gain.exponentialRampToValueAtTime(0.06, t + 0.16); og.gain.exponentialRampToValueAtTime(0.001, t + 0.27);
  osc.connect(og); og.connect(audioCtx.destination); osc.start(t + 0.15); osc.stop(t + 0.28);
}
document.addEventListener('touchstart', initAudio, {passive:true, once:true});
document.addEventListener('click', initAudio, {once:true});

/* ============ 页面构建 ============ */
function pad(n){ return n < 10 ? '0' + n : '' + n; }
function coverHTML(){
  return '<div class="cover"><div class="cover-frame"></div><div class="cover-diamond"></div>' +
    '<div class="cover-kicker">千 年 古 树 档 案</div><h1>古树图鉴<br>千年古木志</h1>' +
    '<div class="cover-rule"></div><div class="cover-sub">香樟 · 侧柏 · 金桂 全记录</div>' +
    '<div class="cover-data"><div class="row"><span>五 大 类 别</span><span class="dot"></span><span>109 幅 影 像</span></div>' +
    '<div class="row"><span>千年树龄</span><span class="dot"></span><span>历劫重生</span></div></div>' +
    '<div class="cover-hint">轻触目录 · 翻阅千年</div></div>';
}
function tocHTML(){
  var html = '<div class="toc"><div class="toc-title">目 录</div><div class="toc-sub">CONTENTS</div><div class="toc-list">';
  SECTIONS.forEach(function(s, i){
    html += '<div class="toc-item" data-sec="' + i + '">' +
      '<div><div class="t-name">' + s.name + '</div><div class="t-sub">' + s.sub + '</div></div>' +
      '<div class="t-meta"><span class="t-count">' + s.count + ' 幅</span><span class="t-arrow">›</span></div>' +
      '</div>';
  });
  html += '</div></div>';
  return html;
}
function sectionHTML(i){
  var s = SECTIONS[i];
  return '<div class="section"><div class="section-frame"></div>' +
    '<div class="section-no">第 ' + (i+1) + ' 章</div>' +
    '<div class="section-name">' + s.name + '</div>' +
    '<div class="section-rule"></div><div class="section-sub">' + s.sub + '</div>' +
    '<div class="section-count">共 ' + s.count + ' 幅影像 · 轻触翻阅</div></div>';
}
function backcoverHTML(){
  return '<div class="backcover"><div class="the-end">完</div><div class="end-sub">千年古树档案 · 古树图鉴</div></div>';
}
function backMarkHTML(no){
  return '<div class="back-mark"><svg width="30" height="30" viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"><path d="M20 6 C16 12 14 16 14 21 C14 27 17 32 20 34 C23 32 26 27 26 21 C26 16 24 12 20 6 Z"/><path d="M8 34 L32 34"/></svg><div class="back-no">' + no + '</div></div>';
}

function createPage(idx){
  var p = document.createElement('div');
  p.className = 'page';
  p.dataset.idx = idx;
  var front = document.createElement('div');
  front.className = 'pg-face pg-front';
  var t = PAGE_TYPES[idx];
  if(t === 'cover') front.innerHTML = coverHTML();
  else if(t === 'toc') front.innerHTML = tocHTML();
  else if(t === 'photo'){
    var img = document.createElement('img');
    img.className = 'photo';
    img.alt = '古树影像 ' + idx;
    img.decoding = 'async';
    img.onload = function(){ img.classList.add('loaded'); };
    img.src = SECTIONS[PHOTO_INDEX[idx].sec].urls[PHOTO_INDEX[idx].img];
    front.appendChild(img);
  }
  else if(t === 'backcover') front.innerHTML = backcoverHTML();
  else front.innerHTML = sectionHTML(SECTION_PAGES.indexOf(idx));
  var back = document.createElement('div');
  back.className = 'pg-face pg-back';
  back.innerHTML = backMarkHTML(pad(idx + 1));
  p.appendChild(front);
  p.appendChild(back);
  return p;
}

/* 滑动窗口：确保 idx±RANGE 存在，销毁范围外 */
function syncRange(idx){
  var i, k;
  for(i = idx - RANGE; i <= idx + RANGE; i++){
    if(i < 0 || i >= TOTAL) continue;
    if(!pageEls[i]){
      var p = createPage(i);
      pageEls[i] = p;
      book.appendChild(p);
    }
  }
  for(k in pageEls){
    var n = parseInt(k, 10);
    if(Math.abs(n - idx) > RANGE){
      var el = pageEls[k];
      if(el.parentNode) el.parentNode.removeChild(el);
      delete pageEls[k];
    }
  }
}

/* 清理所有页面 */
function clearAll(){
  for(var k in pageEls){
    var el = pageEls[k];
    if(el.parentNode) el.parentNode.removeChild(el);
    delete pageEls[k];
  }
}

/* 设置当前页状态 */
function setCur(idx, animateIn){
  cur = idx;
  clearAll();
  syncRange(idx);
  var el = pageEls[idx];
  el.classList.add('is-cur');
  if(animateIn) el.classList.add('page-in');
  resize();
  updateUI();
}

/* ============ 尺寸 ============ */
var COVER_RATIO = 0.62;
function pageRatio(idx){
  var t = PAGE_TYPES[idx];
  if(t === 'photo'){
    var info = PHOTO_INDEX[idx];
    return SECTIONS[info.sec].ratios[info.img];
  }
  return COVER_RATIO;
}
function resize(){
  var ratio = pageRatio(cur);
  var w = window.innerWidth, h = window.innerHeight;
  var bh = Math.min(h * 0.78, 860);
  var bw = bh * ratio;
  if(bw > w * 0.9){ bw = w * 0.9; bh = bw / ratio; }
  book.style.width = bw + 'px';
  book.style.height = bh + 'px';
}

/* ============ 翻页 ============ */
function goNext(){
  if(animating || cur >= TOTAL - 1) return;
  animating = true;
  playFlipSound();
  syncRange(cur + 1);
  var el = pageEls[cur];
  el.classList.add('is-flipping', 'flip-fwd');
  var done = false;
  var onEnd = function(e){
    if(done) return;
    if(e && e.animationName && e.animationName !== 'flipFwd') return;
    done = true;
    el.removeEventListener('animationend', onEnd);
    setCur(cur + 1, false);
    animating = false;
  };
  el.addEventListener('animationend', onEnd);
  setTimeout(function(){ if(animating) onEnd(null); }, 650);
}
function goPrev(){
  if(animating || cur <= 0) return;
  animating = true;
  playFlipSound();
  syncRange(cur - 1);
  var el = pageEls[cur];
  el.classList.add('is-flipping', 'flip-back');
  var done = false;
  var onEnd = function(e){
    if(done) return;
    if(e && e.animationName && e.animationName !== 'flipBack') return;
    done = true;
    el.removeEventListener('animationend', onEnd);
    setCur(cur - 1, false);
    animating = false;
  };
  el.addEventListener('animationend', onEnd);
  setTimeout(function(){ if(animating) onEnd(null); }, 650);
}
/* 目录/章节跳转 */
function jumpTo(target){
  if(animating || target === cur || target < 0 || target >= TOTAL) return;
  animating = true;
  playFlipSound();
  var el = pageEls[cur];
  var dir = target > cur ? 'flip-fwd' : 'flip-back';
  el.classList.add('is-flipping', dir);
  setTimeout(function(){
    setCur(target, true);
    animating = false;
  }, 300);
}
function updateUI(){
  pager.innerHTML = '<b>' + (cur + 1) + '</b> / ' + TOTAL;
  btnPrev.classList.toggle('disabled', cur <= 0);
  btnNext.classList.toggle('disabled', cur >= TOTAL - 1);
}

/* ============ 交互 ============ */
var startX = 0, startY = 0, moved = false, suppressClick = false;
book.addEventListener('touchstart', function(e){
  startX = e.touches[0].clientX; startY = e.touches[0].clientY; moved = false;
}, {passive:true});
book.addEventListener('touchmove', function(e){
  var dx = e.touches[0].clientX - startX, dy = e.touches[0].clientY - startY;
  if(Math.abs(dx) > 8 || Math.abs(dy) > 8) moved = true;
  if(moved && Math.abs(dx) > Math.abs(dy)) e.preventDefault();
}, {passive:false});
book.addEventListener('touchend', function(e){
  if(!moved) return;
  var dx = e.changedTouches[0].clientX - startX;
  if(Math.abs(dx) > 40){
    suppressClick = true;
    if(dx < 0) goNext(); else goPrev();
    setTimeout(function(){ suppressClick = false; }, 350);
  }
}, {passive:true});
book.addEventListener('click', function(e){
  if(suppressClick) return;
  var tocItem = e.target.closest('.toc-item');
  if(tocItem){
    var si = parseInt(tocItem.getAttribute('data-sec'), 10);
    jumpTo(SECTION_PAGES[si]);
    return;
  }
  var si2 = SECTION_PAGES.indexOf(cur);
  if(PAGE_TYPES[cur] === 'section' && si2 >= 0){
    goNext();
    return;
  }
  var r = book.getBoundingClientRect();
  var x = e.clientX - r.left;
  if(x < r.width * 0.42) goPrev();
  else if(x > r.width * 0.58) goNext();
});
btnPrev.addEventListener('click', goPrev);
btnNext.addEventListener('click', goNext);
document.addEventListener('keydown', function(e){
  if(e.key === 'ArrowRight') goNext();
  else if(e.key === 'ArrowLeft') goPrev();
});
window.addEventListener('resize', resize);

/* ============ 启动：立即渲染封面，无需等待图片 ============ */
function start(){
  setCur(0, true);
  book.classList.add('ready');
  loader.classList.add('hide');
  updateUI();
  setTimeout(function(){ toast.classList.add('show'); setTimeout(function(){ toast.classList.remove('show'); }, 3000); }, 350);
}
setTimeout(start, 60);
})();
</script>
