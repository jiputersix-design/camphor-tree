  src.connect(bp); bp.connect(g); g.connect(audioCtx.destination); src.start(t);
  var osc = audioCtx.createOscillator(); osc.type = 'sine';
  osc.frequency.setValueAtTime(190, t + 0.13); osc.frequency.exponentialRampToValueAtTime(65, t + 0.23);
  var og = audioCtx.createGain();
  og.gain.setValueAtTime(0.0001, t + 0.13); og.gain.exponentialRampToValueAtTime(0.055, t + 0.14); og.gain.exponentialRampToValueAtTime(0.001, t + 0.25);
  osc.connect(og); og.connect(audioCtx.destination); osc.start(t + 0.13); osc.stop(t + 0.26);
}
document.addEventListener('touchstart', initAudio, {passive:true, once:true});
document.addEventListener('click', initAudio, {once:true});

/* ============ 页面构建 ============ */
function pad(n){ return n < 10 ? '0' + n : '' + n; }
function coverHTML(){
  return '<div class="cover"><div class="cover-frame"></div><div class="cover-diamond"></div>' +
    '<div class="cover-kicker">千 年 古 树 档 案</div><h1>古树图鉴<br>千年古木志</h1>' +
    '<div class="cover-rule"></div><div class="cover-sub">香樟 · 侧柏 · 金桂 全记录</div>' +
    '<div class="cover-data"><div class="row"><span>五 大 类 别</span><span class="dot"></span><span>109 幅 影 像</span></div>' +
    '<div class="row"><span>千年树龄</span><span class="dot"></span><span>历劫重生</span></div></div>' +
    '<div class="cover-hint">轻触目录 · 翻阅千年</div></div>';
}
function tocHTML(){
  var html = '<div class="toc"><div class="toc-title">目 录</div><div class="toc-sub">CONTENTS</div><div class="toc-list">';
  SECTIONS.forEach(function(s, i){
    html += '<div class="toc-item" data-sec="' + i + '">' +
      '<div><div class="t-name">' + s.name + '</div><div class="t-sub">' + s.sub + '</div></div>' +
      '<div class="t-meta"><span class="t-count">' + s.count + ' 幅</span><span class="t-arrow">›</span></div>' +
      '</div>';
  });
  html += '</div></div>';
  return html;
}
function sectionHTML(i){
  var s = SECTIONS[i];
  return '<div class="section"><div class="section-frame"></div>' +
    '<div class="section-no">第 ' + (i+1) + ' 章</div>' +
    '<div class="section-name">' + s.name + '</div>' +
    '<div class="section-rule"></div><div class="section-sub">' + s.sub + '</div>' +
    '<div class="section-count">共 ' + s.count + ' 幅影像 · 轻触翻阅</div></div>';
}
function backcoverHTML(){
  return '<div class="backcover"><div class="the-end">完</div><div class="end-sub">千年古树档案 · 古树图鉴</div></div>';
}

function createPage(idx){
  var p = document.createElement('div');
  p.className = 'page';
  p.dataset.idx = idx;
  var t = PAGE_TYPES[idx];
  var inner = document.createElement('div');
  inner.className = 'page-inner';
  if(t === 'cover') inner.innerHTML = coverHTML();
  else if(t === 'toc') inner.innerHTML = tocHTML();
  else if(t === 'photo'){
    var img = document.createElement('img');
    img.className = 'photo';
    img.alt = '古树影像 ' + idx;
    img.decoding = 'async';
    img.onload = function(){ img.classList.add('loaded'); };
    img.src = SECTIONS[PHOTO_INDEX[idx].sec].urls[PHOTO_INDEX[idx].img];
    inner.appendChild(img);
  }
  else if(t === 'backcover') inner.innerHTML = backcoverHTML();
  else inner.innerHTML = sectionHTML(SECTION_PAGES.indexOf(idx));
  var edge = document.createElement('div');
  edge.className = 'paper-edge';
  p.appendChild(inner);
  p.appendChild(edge);
  return p;
}

function syncRange(idx){
  var i, k;
  for(i = idx - RANGE; i <= idx + RANGE; i++){
    if(i < 0 || i >= TOTAL) continue;
    if(!pageEls[i]){
      var p = createPage(i);
      pageEls[i] = p;
      book.appendChild(p);
    }
  }
  for(k in pageEls){
    var n = parseInt(k, 10);
    if(Math.abs(n - idx) > RANGE){
      var el = pageEls[k];
      el.style.transform = '';
      el.style.opacity = '';
      if(el.parentNode) el.parentNode.removeChild(el);
      delete pageEls[k];
    }
  }
}
function clearAll(){
  for(var k in pageEls){
    var el = pageEls[k];
    el.style.transform = ''; el.style.opacity = '';
    if(el.parentNode) el.parentNode.removeChild(el);
    delete pageEls[k];
  }
}
function setCur(idx, animateIn){
  cur = idx;
  clearAll();
  syncRange(idx);
  var el = pageEls[idx];
  el.classList.add('is-cur');
  if(animateIn) el.classList.add('page-in');
  resize();
  updateUI();
}
function bookWidth(){
  return book.getBoundingClientRect().width;
}

/* ============ 尺寸 ============ */
var COVER_RATIO = 0.62;
function pageRatio(idx){
  var t = PAGE_TYPES[idx];
  if(t === 'photo'){
    var info = PHOTO_INDEX[idx];
    return SECTIONS[info.sec].ratios[info.img];
  }
  return COVER_RATIO;
}
function resize(){
  var ratio = pageRatio(cur);
  var w = window.innerWidth, h = window.innerHeight;
  var bh = Math.min(h * 0.8, 900);
  var bw = bh * ratio;
  if(bw > w * 0.92){ bw = w * 0.92; bh = bw / ratio; }
  book.style.width = bw + 'px';
  book.style.height = bh + 'px';
}

/* ============ 翻页（3D 跟手） ============ */
function finishFlip(dir, A, B){
  animating = true;
  var fired = false;
  function cleanup(){
    if(fired) return;
    fired = true;
    animating = false;
    A.style.transition = ''; A.style.transform = ''; A.style.transformOrigin = '';
    A.classList.remove('is-flipping');
    if(B) B.classList.remove('is-peer');
    setCur(cur + dir, false);
  }
  var onEnd = function(ev){
    if(ev && ev.propertyName && ev.propertyName !== 'transform') return;
    A.removeEventListener('transitionend', onEnd);
    cleanup();
  };
  A.addEventListener('transitionend', onEnd);
  setTimeout(cleanup, 430);
}
function goNext(){
  if(animating || cur >= TOTAL - 1) return;
  playFlipSound();
  syncRange(cur + 1);
  var A = pageEls[cur], B = pageEls[cur + 1];
  A.classList.add('is-flipping');
  A.style.transition = 'none';
  A.style.transformOrigin = 'left center';
  A.style.transform = 'rotateY(0deg)';
  void A.offsetWidth;
  A.style.transition = 'transform .3s cubic-bezier(.33,.1,.27,1)';
  A.style.transform = 'rotateY(-180deg)';
  finishFlip(1, A, B);
}
function goPrev(){
  if(animating || cur <= 0) return;
  playFlipSound();
  syncRange(cur - 1);
  var A = pageEls[cur], B = pageEls[cur - 1];
  A.classList.add('is-flipping');
  A.style.transition = 'none';
  A.style.transformOrigin = 'right center';
  A.style.transform = 'rotateY(0deg)';
  void A.offsetWidth;
  A.style.transition = 'transform .3s cubic-bezier(.33,.1,.27,1)';
  A.style.transform = 'rotateY(180deg)';
  finishFlip(-1, A, B);
}
function jumpTo(target){
  if(animating || target === cur || target < 0 || target >= TOTAL) return;
  playFlipSound();
  var A = pageEls[cur];
  var dir = target > cur ? 1 : -1;
  A.classList.add('is-flipping');
  A.style.transition = 'none';
  A.style.transformOrigin = dir === 1 ? 'left center' : 'right center';
  A.style.transform = 'rotateY(0deg)';
  void A.offsetWidth;
  A.style.transition = 'transform .2s ease-in';
  A.style.transform = 'rotateY(' + (dir * 180) + 'deg)';
  animating = true;
  setTimeout(function(){
    animating = false;
    setCur(target, true);
  }, 215);
}
function updateUI(){
  pager.innerHTML = '<b>' + (cur + 1) + '</b> / ' + TOTAL;
  btnPrev.classList.toggle('disabled', cur <= 0);
  btnNext.classList.toggle('disabled', cur >= TOTAL - 1);
  btnToc.classList.toggle('disabled', cur === 1 || cur === 0);
}

/* ============ 手势（Pointer：手机触摸 + 电脑鼠标通用） ============ */
var sx = 0, sy = 0, dragging = false, dragDir = 0, suppressClick = false, pointerId = null;
function dragUpdate(dx){
  if(!dragging) return;
  var A = pageEls[cur];
  var B = pageEls[cur + dragDir];
  var deg;
  if(dragDir === 1){
    deg = Math.max(-78, Math.min(0, dx * 0.55));
  } else {
    deg = Math.min(78, Math.max(0, dx * 0.55));
  }
  A.style.transition = 'none';
  A.style.transformOrigin = dragDir === 1 ? 'left center' : 'right center';
  A.style.transform = 'rotateY(' + deg + 'deg)';
  if(B) B.classList.add('is-peer');
}
function dragEnd(dx){
  if(!dragging) return;
  dragging = false;
  var A = pageEls[cur];
  var B = pageEls[cur + dragDir];
  var w = bookWidth();
  var threshold = Math.max(w * 0.16, 40);
  if(Math.abs(dx) > threshold && B){
    A.style.transition = 'transform .28s cubic-bezier(.33,.1,.27,1)';
    A.style.transform = 'rotateY(' + (dragDir * 180) + 'deg)';
    finishFlip(dragDir, A, B);
  } else {
    A.style.transition = 'transform .22s ease-out';
    A.style.transform = 'rotateY(0deg)';
    var fired = false;
    var onEnd = function(ev){
      if(fired) return;
      if(ev && ev.propertyName && ev.propertyName !== 'transform') return;
      fired = true;
      A.removeEventListener('transitionend', onEnd);
      A.style.transition = ''; A.style.transform = ''; A.style.transformOrigin = '';
      A.classList.remove('is-flipping');
      if(B) B.classList.remove('is-peer');
    };
    A.addEventListener('transitionend', onEnd);
    setTimeout(function(){ if(!fired){ fired = true; A.style.transition=''; A.style.transform=''; A.style.transformOrigin=''; A.classList.remove('is-flipping'); if(B) B.classList.remove('is-peer'); } }, 300);
  }
}
book.addEventListener('pointerdown', function(e){
  if(animating || pointerId !== null) return;
  pointerId = e.pointerId;
  sx = e.clientX; sy = e.clientY;
}, {passive:true});
book.addEventListener('pointermove', function(e){
  if(e.pointerId !== pointerId || animating) return;
  var dx = e.clientX - sx;
  var dy = e.clientY - sy;
  if(!dragging && Math.abs(dx) > 7 && Math.abs(dx) > Math.abs(dy)){
    dragging = true;
    dragDir = dx < 0 ? 1 : -1;
    var target = cur + dragDir;
    if(target < 0 || target >= TOTAL){ dragging = false; pointerId = null; return; }
    if(!pageEls[target]) syncRange(target);
    pageEls[cur].classList.add('is-flipping');
  }
  if(dragging){
    e.preventDefault();
    dragUpdate(dx);
  }
}, {passive:false});
book.addEventListener('pointerup', function(e){
  if(e.pointerId !== pointerId) return;
  pointerId = null;
  if(!dragging) return;
  var dx = e.clientX - sx;
  suppressClick = true;
  dragEnd(dx);
  setTimeout(function(){ suppressClick = false; }, 340);
}, {passive:true});
book.addEventListener('pointercancel', function(e){
  if(e.pointerId !== pointerId) return;
  pointerId = null;
  if(dragging){
    dragEnd(0);
    suppressClick = false;
  }
}, {passive:true});
book.addEventListener('dragstart', function(e){ e.preventDefault(); }, {passive:false});

/* 点击翻页 & 目录跳转 */
book.addEventListener('click', function(e){
  if(suppressClick || animating) return;
  var tocItem = e.target.closest('.toc-item');
  if(tocItem){
    var si = parseInt(tocItem.getAttribute('data-sec'), 10);
    jumpTo(SECTION_PAGES[si]);
    return;
  }
  var si2 = SECTION_PAGES.indexOf(cur);
  if(PAGE_TYPES[cur] === 'section' && si2 >= 0){
    goNext();
    return;
  }
  var r = book.getBoundingClientRect();
  var x = e.clientX - r.left;
  if(x < r.width * 0.42) goPrev();
  else if(x > r.width * 0.58) goNext();
});
btnPrev.addEventListener('click', goPrev);
btnNext.addEventListener('click', goNext);
btnToc.addEventListener('click', function(){ jumpTo(1); });
document.addEventListener('keydown', function(e){
  if(e.key === 'ArrowRight') goNext();
  else if(e.key === 'ArrowLeft') goPrev();
});
window.addEventListener('resize', resize);

function start(){
  setCur(0, true);
  book.classList.add('ready');
  loader.classList.add('hide');
  updateUI();
  setTimeout(function(){ toast.classList.add('show'); setTimeout(function(){ toast.classList.remove('show'); }, 3000); }, 350);
}
setTimeout(start, 60);
})();
</script>
